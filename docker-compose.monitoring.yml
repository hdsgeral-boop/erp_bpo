version: '3.8'

name: erp_consulvolt_monitoring

services:
  # 1. Prometheus Metrics Engine
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: erp_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - erp_private_network

  # 2. Grafana Visual Dashboard Engine
  grafana:
    image: grafana/grafana:10.4.0
    container_name: erp_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - erp_private_network

  # 3. cAdvisor Container Metrics Engine
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: erp_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - erp_private_network

  # 4. Redis Exporter Engine
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: erp_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_2026}
    ports:
      - "9121:9121"
    networks:
      - erp_private_network

  # 5. Node Exporter Hardware Engine
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: erp_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - erp_private_network

volumes:
  prometheus_data:
  grafana_data:

networks:
  erp_private_network:
    external: true
    name: erp_consulvolt_stack_erp_private_network
