name: erp_consulvolt_prod

services:
  backend:
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"

  horizon:
    restart: always

  queue:
    restart: always

  scheduler:
    restart: always

  postgres:
    restart: always

  redis:
    restart: always
