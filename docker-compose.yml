name: erp_consulvolt_stack

services:
  # 1. PostgreSQL 16 Base de Dados Principal
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-erp_consulvolt}
      POSTGRES_USER: ${DB_USERNAME:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - erp_private_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-erp_user} -d ${DB_DATABASE:-erp_consulvolt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Infraestrutura (Cache, Sessions, Queues, Locks)
  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password_2026}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - erp_private_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Laravel Backend PHP-FPM
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.docker
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp_private_network

  # 4. Laravel Horizon Queue Manager
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    env_file:
      - .env.docker
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      - backend
      - redis
    networks:
      - erp_private_network

  # 5. Dedicated Queue Worker (High Priority)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --queue=high,agt,payroll,exports,default --sleep=2 --tries=3 --max-time=3600
    env_file:
      - .env.docker
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      - backend
      - redis
    networks:
      - erp_private_network

  # 6. Dedicated Cron Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    env_file:
      - .env.docker
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      - backend
    networks:
      - erp_private_network

  # 7. Nginx Reverse Proxy HTTP/2 Engine
  nginx:
    image: nginx:1.25-alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
    depends_on:
      - backend
    networks:
      - erp_private_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 8. PgAdmin 4 Database Management GUI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@consulvolt.co.ao
      PGADMIN_DEFAULT_PASSWORD: admin_secure_password
    ports:
      - "5050:80"
    networks:
      - erp_private_network

  # 9. Mailpit Test Email Sandbox
  mailpit:
    image: axllent/mailpit:latest
    container_name: erp_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - erp_private_network

volumes:
  postgres_data:
  redis_data:

networks:
  erp_private_network:
    driver: bridge
