global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'erp_nginx'
    static_configs:
      - targets: ['nginx:80']

  - job_name: 'erp_redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'erp_postgres'
    static_configs:
      - targets: ['postgres:5432']
